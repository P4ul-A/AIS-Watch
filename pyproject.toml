[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ais-watch"
version = "0.1.0"
description = "Norwegian AIS seasonal archive, day replay and incident review"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "waitress>=3.0.2,<4",
    "requests>=2.32.4,<3",
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "shapely>=2.1,<3",
    "duckdb>=1.3,<2",
    "Jinja2>=3.1.6,<4",
    "tzdata>=2025.2",
]

[project.scripts]
ais-watch = "ais_watch.__main__:main"

[tool.setuptools.packages.find]
include = ["ais_watch*", "scripts*"]

[tool.setuptools.package-data]
ais_watch = ["templates/*.html", "static/*.css", "static/*.js", "static/*.png"]
"scripts.common" = ["*.html", "*.js", "vendor/*", "maps/*.geojson"]
"scripts.tracks" = ["skjervoy_2026-11-01.ini"]
"scripts.incidents" = ["config.ini"]
