# Example for find_incidents.py: the user-labelled BRIM / WHALE2SEA3 encounter.
[tracks]
source = api
start = 2026-10-17
end = 2026-10-18
data = ../output/joining_example/positions.parquet
output = ../output/incidents.html
# Incident analysis and replay use max_gap_minutes below.

[area]
file = ../output/joining_example/area.geojson

[vessels]
# Names, MMSIs and colours; the incident groups below assign analysis roles.
WHALE2SEA5 = 259045050 / #009e73
WHALE2SEA2 = 259022180 / #009e73
WHALE2SEA3 = 259032110 / #79cca2
BARD = 259019260 / #8c0062
BRIM = 257085820 / #b83d95
BERG = 257095980 / #e956bd
RYGERDRONNINGEN = 257033490 / #d55e00

[incidents]
# One vessel name or MMSI per line. The groups must not overlap.
small_boats =
    WHALE2SEA3
    WHALE2SEA2
    WHALE2SEA5
big_boats =
    BRIM
    BARD
    BERG
    RYGERDRONNINGEN

# Flag rule: the big boat enters this moving radius around a small boat.
radius_m = 1000
# Flag rule: the small boat stays at or below this speed, in knots.
max_small_speed_knots = 3
# Flag rule: prior slow/local activity, with the big boat outside the circle.
# During this window the small boat also stays within radius_m of its start.
prior_minutes = 2
# Flag rule: minimum time together while the small boat remains slow.
# This example needs 2 minutes. The detector's omitted-value default is 5.
together_minutes = 2
# Data quality: never interpolate between fixes farther apart than this.
# Missing coverage breaks the prior-activity and encounter windows.
max_gap_minutes = 5
