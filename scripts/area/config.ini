# Example for plot_area.py: discover every boat present in the supplied files.
# This saved example contains only BRIM and WHALE2SEA3. Use a wider download
# or source = api to discover additional boats.
[tracks]
source = api
start = 2026-11-01
end = 2026-11-02
data = ../output/joining_example/positions.parquet
output = ../output/area_tracks.html
gap_minutes = 450
# Large-area overview only: retain all boats, but sample reports for display.
# Set display_interval_seconds = 0 for full resolution.
display_interval_seconds = 100
# Avoid creating a separate fading path for every 15-minute track section.
fade_trails = true

[area]
# --area overrides this config-relative GeoJSON path.
# GeoJSON stores only the area; dates come from [tracks] above or CLI overrides.
file = ../output/joining_example/area.geojson

[vessels]
# Optional names and colours for discovered boats; this does not limit discovery.
WHALE2SEA3 = 259032110 / #79cca2
BRIM = 257085820 / #b83d95
